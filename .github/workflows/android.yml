name: Build DREDD Trading AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q DREDD_Trading_AI_Android_v02.zip -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f

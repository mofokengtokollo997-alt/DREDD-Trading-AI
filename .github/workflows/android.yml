name: Build DREDD Trading AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q DREDD_Trading_AI_Android_v02.zip -d project

      - name: Inspect project structure
        run: |
          find project -maxdepth 4 -type f | head -100

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DREDD-Trading-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
